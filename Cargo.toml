[workspace]

[package]
name = "magnetar-provider-npu"
version = "0.1.0"
edition = "2024"
# Never published to crates.io independently -- this crate is only
# buildable from within a checkout of the parent Magnetar repository,
# matching every other externalized module's own Cargo.toml.
publish = false

[dependencies]
# Path dependency, not a published crate: this crate is only buildable
# from within a checkout of the parent Magnetar repository, with this
# submodule checked out at `providers/npu`.
magnetar-runtime = { path = "../../magnetar-runtime" }
# Dynamically loads the real oneAPI Level Zero loader shared library at
# runtime (`ze_loader.dll`/`libze_loader.so.1`) instead of linking against
# it at build time -- the same dynamic-loading posture `providers/rocm`'s
# own `libloading` use already establishes for HIP, so this crate keeps
# building and testing on a machine or CI runner with no Level Zero driver
# installed at all (every machine/runner this repository currently has).
# Level Zero is the real, vendor-neutral low-level API Intel's NPU (branded
# "VPU" inside the API itself: `ZE_INIT_FLAG_VPU_ONLY`) is accessed
# through -- not a proprietary or guessed interface.
libloading = "0.8"
